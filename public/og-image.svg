<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1425"/>
      <stop offset="50%" stop-color="#101d33"/>
      <stop offset="100%" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d5ab56"/>
      <stop offset="100%" stop-color="#f3d893"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#d5ab56" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Top Brand -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#172b4b" stroke="#d5ab56" stroke-width="2"/>
    <text x="24" y="31" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#d5ab56" text-anchor="middle">PTR</text>
    <text x="64" y="32" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#d5ab56" letter-spacing="-0.5">PayrollTaxReform.com</text>
  </g>

  <!-- Badge -->
  <g transform="translate(80, 185)">
    <rect x="0" y="0" width="380" height="36" rx="18" fill="#172b4b" stroke="#d5ab56" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="190" y="23" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#d5ab56" text-anchor="middle" letter-spacing="1.5">INDEPENDENT U.S. PAYROLL TAX RESOURCE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="285" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffffff" line-height="1.15">
    Understand Payroll Taxes.
  </text>
  <text x="80" y="350" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="url(#gold)">
    Compare Software. Run Smarter.
  </text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b8c3d4">
    Comprehensive Guides · Free Calculators · State Tax Rules · Software Comparisons
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="220" height="54" rx="10" fill="#14233b" stroke="#d5ab56" stroke-width="1" stroke-opacity="0.3"/>
    <text x="110" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e9edf5" text-anchor="middle">FICA &amp; Withholding</text>

    <rect x="240" y="0" width="200" height="54" rx="10" fill="#14233b" stroke="#d5ab56" stroke-width="1" stroke-opacity="0.3"/>
    <text x="340" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e9edf5" text-anchor="middle">50-State Guides</text>

    <rect x="460" y="0" width="220" height="54" rx="10" fill="#14233b" stroke="#d5ab56" stroke-width="1" stroke-opacity="0.3"/>
    <text x="570" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e9edf5" text-anchor="middle">Payroll Calculator</text>

    <rect x="700" y="0" width="240" height="54" rx="10" fill="#14233b" stroke="#d5ab56" stroke-width="1" stroke-opacity="0.3"/>
    <text x="820" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e9edf5" text-anchor="middle">Software Reviews</text>
  </g>
</svg>

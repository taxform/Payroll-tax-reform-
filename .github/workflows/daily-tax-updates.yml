name: Daily IRS Tax Updates

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-tax-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect official IRS announcements
        run: python scripts/update_irs.py

      - name: Publish updated announcements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-updates.json
          if git diff --cached --quiet; then
            echo "No new updates to publish."
          else
            git commit -m "Update official IRS announcements"
            git push
          fi

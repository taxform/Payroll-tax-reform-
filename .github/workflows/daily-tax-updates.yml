name: Daily IRS Tax Updates

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tax-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check IRS news feed
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          url = https://www.irs.gov/newsroom
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "PayrollTaxReform/1.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read()
              ET.fromstring(data)
              print("IRS feed checked successfully.")
          except Exception as error:
              print(f"IRS feed check failed: {error}")
              raise
          PY

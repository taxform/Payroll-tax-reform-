name: Apply Form 940 patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: form-940-guide
      - name: Apply patch and commit
        run: |
          git config user.name taxform
          git config user.email taxform@users.noreply.github.com
          git status --short
          git apply --whitespace=fix form-940.patch
          rm form-940.patch
          git add -A
          git status --short
          git commit -m "Add Form 940 guide: FUTA guide for employers" || echo "nothing to commit"
          git push origin form-940-guide

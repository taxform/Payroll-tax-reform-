name: PayrollCheck prototype smoke tests
on:
  push:
    branches:
      - feature/payrollcheck-free-audit
  pull_request:
    paths:
      - 'public/payrollcheck/**'
      - 'tests/payrollcheck-*.test.mjs'
      - 'src/payrollcheck/**'
      - '.github/workflows/payrollcheck-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PayrollCheck prototype source safeguards
        run: node --test tests/payrollcheck-*.test.mjs

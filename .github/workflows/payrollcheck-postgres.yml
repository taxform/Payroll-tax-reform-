name: PayrollCheck isolated PostgreSQL schema test
on:
  push:
    branches: [feature/payrollcheck-free-audit, main]
    paths:
      - 'docs/sql/payrollcheck-deny-by-default-schema.sql'
      - 'docs/sql/payrollcheck-sessions-schema.sql'
      - 'docs/sql/payrollcheck-rls-policies.sql'
      - 'docs/sql/payrollcheck-companies-schema.sql'
      - 'docs/sql/payrollcheck-employees-schema.sql'
      - 'tests/sql/payrollcheck-rls-smoke.sql'
      - 'tests/sql/payrollcheck-consent-constraints.sql'
      - 'tests/sql/payrollcheck-rls-regression.sql'
      - 'tests/sql/payrollcheck-sessions-store.sql'
      - '.github/workflows/payrollcheck-postgres.yml'
  pull_request:
    paths:
      - 'docs/sql/payrollcheck-deny-by-default-schema.sql'
      - 'docs/sql/payrollcheck-sessions-schema.sql'
      - 'docs/sql/payrollcheck-rls-policies.sql'
      - 'docs/sql/payrollcheck-companies-schema.sql'
      - 'docs/sql/payrollcheck-employees-schema.sql'
      - 'tests/sql/payrollcheck-rls-smoke.sql'
      - 'tests/sql/payrollcheck-consent-constraints.sql'
      - 'tests/sql/payrollcheck-rls-regression.sql'
      - 'tests/sql/payrollcheck-sessions-store.sql'
      - '.github/workflows/payrollcheck-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: payrollcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payrollcheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: payrollcheck_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply draft schema to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/payrollcheck-deny-by-default-schema.sql
      - name: Apply sessions schema to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/payrollcheck-sessions-schema.sql
      - name: Verify RLS denies an otherwise granted unprivileged role
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/payrollcheck-rls-smoke.sql
      - name: Verify consent constraints in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/payrollcheck-consent-constraints.sql
      - name: Add auth_user_id column (identity-link equivalent for disposable Postgres)
        run: psql -X -v ON_ERROR_STOP=1 -c "ALTER TABLE payrollcheck.memberships ADD COLUMN IF NOT EXISTS auth_user_id uuid;"
      - name: Apply company profile schema (Slice 2)
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/payrollcheck-companies-schema.sql
      - name: Apply employees schema (Slice 3)
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/payrollcheck-employees-schema.sql

      - name: Apply tenant-scoped RLS policies (M2 step 7)
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/payrollcheck-rls-policies.sql
      - name: Test tenant isolation, grant lifecycle, and sessions RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/payrollcheck-rls-regression.sql
      - name: Test session store queries in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/payrollcheck-sessions-store.sql
